[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "espn-fantasy-draft-agent"
version = "0.1.0"
description = "Local ESPN fantasy football draft recommendation engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
draft-agent = "draft_agent.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
draft_agent = ["web/*.html"]
